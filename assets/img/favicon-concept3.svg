<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Dégradé Signature pour le texte JD -->
    <linearGradient id="c3-text-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="c3-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb1ef"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <!-- Squircle Moderne avec bordure dégradée -->
  <rect x="2" y="2" width="60" height="60" rx="18" ry="18" fill="#00252e" stroke="url(#c3-border-grad)" stroke-width="3"/>
  
  <!-- Monogramme JD blanc vers turquoise avec étincelle créative ✦ -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Montserrat', 'Inter', sans-serif" font-weight="900" font-size="28" letter-spacing="0.5" text-anchor="middle">
    <text x="29" y="42" fill="url(#c3-text-gradient)">JD</text>
  </g>
  <!-- Mini étincelle 4 branches rose en haut à droite -->
  <path d="M 48 14 Q 48 19 53 19 Q 48 19 48 24 Q 48 19 43 19 Q 48 19 48 14 Z" fill="#ffb1ef"/>
</svg>
