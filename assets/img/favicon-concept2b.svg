<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Dégradé Signature Rose -> Ciel -> Menthe -->
    <linearGradient id="c2b-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb1ef"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="c2b-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#00141a" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Anneau dégradé extérieur -->
  <circle cx="32" cy="32" r="30" fill="url(#c2b-gradient)"/>
  
  <!-- Intérieur bleu nuit profond #00252e -->
  <circle cx="32" cy="32" r="26" fill="#00252e"/>
  
  <!-- Initiales bicolores harmonisées avec l'anneau : J rose, D menthe turquoise -->
  <g filter="url(#c2b-glow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Montserrat', 'Inter', sans-serif" font-weight="900" font-size="27" letter-spacing="-0.5">
    <text x="17" y="41" fill="#ffb1ef">J</text>
    <text x="32" y="41" fill="#2dd4bf">D</text>
  </g>
</svg>
