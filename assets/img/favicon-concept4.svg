<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Dégradé Signature -->
    <linearGradient id="c4-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb1ef"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="c4-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Disque sombre uniforme -->
  <circle cx="32" cy="32" r="30" fill="#00252e" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
  
  <!-- Les lettres JD découpées et remplies par le dégradé néon (effet typographique puissant) -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Montserrat', 'Inter', sans-serif" font-weight="900" font-size="30" letter-spacing="-0.5" text-anchor="middle" filter="url(#c4-glow)">
    <text x="32" y="43" fill="url(#c4-gradient)">JD</text>
  </g>
</svg>
