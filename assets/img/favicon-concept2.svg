<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Dégradé Signature : Rose -> Ciel -> Turquoise -->
    <linearGradient id="c2-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb1ef"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="c2-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Anneau externe dégradé -->
  <circle cx="32" cy="32" r="30" fill="url(#c2-gradient)"/>
  
  <!-- Disque intérieur sombre #00252e créant le halo -->
  <circle cx="32" cy="32" r="26.5" fill="#00252e"/>
  
  <!-- Monogramme JD blanc éclatant avec fine touche d'espacement -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Montserrat', 'Inter', sans-serif" font-weight="900" font-size="28" letter-spacing="0.5" text-anchor="middle">
    <text x="32" y="42" fill="#ffffff" filter="url(#c2-glow)">JD</text>
  </g>
</svg>
